[project]
name = "chemical-import-substitution"
version = "0.1.0"
description = "HSN-8 import-substitution signal analysis for Indian chemical trade (DGCI&S TradeStat)"
requires-python = ">=3.9"
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["data", "design"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # RATIONALE_RULES keeps long regex/prose strings on one line for readability

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.isort]
known-first-party = ["hsn8_signal_analysis"]
